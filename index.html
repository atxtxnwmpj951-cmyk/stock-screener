function Chart({data,color}){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    const w=el.offsetWidth||300,h=44;
    el.width=w*2;el.height=h*2;
    const ctx=el.getContext("2d");ctx.scale(2,2);
    const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,color+"55");g.addColorStop(1,color+"08");
    ctx.beginPath();
    data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=h-(v-mn)/rng*(h-10)-5;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();
    data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=h-(v-mn)/rng*(h-10)-5;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin="round";ctx.stroke();
  },[data,color]);
  return <canvas ref={ref} style={{width:"100%",height:"44px"}}/>;
}
