<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="株スクリーナー">
<title>株スクリーナー Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0e1a;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#0f172a,#1e1b4b);padding:52px 16px 14px;border-bottom:1px solid #1e2d45;position:sticky;top:0;z-index:100}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.header h1{font-size:18px;font-weight:700}
.badge{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;font-size:10px;padding:2px 8px;border-radius:20px}
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sum-card{background:rgba(255,255,255,0.05);border-radius:10px;padding:8px;text-align:center}
.sum-val{font-size:17px;font-weight:800}
.sum-lbl{font-size:10px;color:#94a3b8;margin-top:2px}
.tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.tab{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid #1e2d45;background:#111827;color:#94a3b8;cursor:pointer}
.tab.on{background:#3b82f6;border-color:#3b82f6;color:white}
.filters{padding:10px 16px;background:#111827;border-bottom:1px solid #1e2d45}
.filter-top{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:8px}
.filter-top span{color:#3b82f6;cursor:pointer}
.chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.chip{display:flex;align-items:center;gap:4px;background:#1a2235;border:1px solid #1e2d45;border-radius:7px;padding:5px 7px;font-size:10px;color:#94a3b8;cursor:pointer;user-select:none}
.chip.on{background:rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.5);color:#f1f5f9}
.dot{width:6px;height:6px;border-radius:50%;background:#475569;flex-shrink:0}
.chip.on .dot{background:#3b82f6}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer}
.btn-blue{background:#3b82f6;color:white}
.btn-gray{flex:0 0 72px;background:#1a2235;color:#94a3b8;border:1px solid #1e2d45}
.result-bar{padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
.result-bar div{font-size:12px;color:#94a3b8}
.result-bar b{color:#f1f5f9}
.list{padding:0 16px 100px;display:flex;flex-direction:column;gap:10px}
.card{background:#111827;border:1px solid #1e2d45;border-radius:14px;padding:14px;cursor:pointer;position:relative;overflow:hidden}
.card-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.code{font-size:11px;color:#94a3b8;margin-bottom:2px}
.mkt{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(99,102,241,0.2);color:#a5b4fc;margin-left:4px}
.sname{font-size:15px;font-weight:700}
.score-box{display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:5px 10px;min-width:50px}
.score-num{font-size:20px;font-weight:800;line-height:1}
.score-lbl{font-size:9px;color:#94a3b8}
.price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.price{font-size:22px;font-weight:700}
.chg{font-size:13px;font-weight:600}
.met-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
.met{background:#1a2235;border-radius:7px;padding:6px 8px}
.met-lbl{font-size:10px;color:#94a3b8;margin-bottom:2px}
.met-val{font-size:12px;font-weight:600}
.cond-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.ct{font-size:10px;padding:2px 6px;border-radius:4px}
.ct-pass{background:rgba(16,185,129,0.15);color:#6ee7b7}
.ct-fail{background:rgba(239,68,68,0.1);color:#fca5a5}
.chart-wrap{border-radius:6px;background:#1a2235;overflow:hidden}
canvas{display:block;width:100%;height:44px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;backdrop-filter:blur(6px);align-items:flex-end}
.modal-bg.open{display:flex}
.modal{background:#111827;border-radius:24px 24px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 20px 48px;border:1px solid #1e2d45}
.modal-handle{width:36px;height:4px;background:#1e2d45;border-radius:2px;margin:0 auto 16px}
.modal h2{font-size:20px;font-weight:700;margin-bottom:2px}
.modal-sub{font-size:13px;color:#94a3b8;margin-bottom:16px}
.modal-price{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;padding:12px;background:#1a2235;border-radius:12px}
.modal-price .p{font-size:28px;font-weight:800}
.msec{margin-bottom:16px}
.msec-title{font-size:11px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mmet{background:#1a2235;border-radius:10px;padding:10px 12px}
.mmet .ml{font-size:11px;color:#94a3b8;margin-bottom:4px}
.mmet .mv{font-size:15px;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,0.97);backdrop-filter:blur(20px);border-top:1px solid #1e2d45;display:flex;padding:8px 0 28px;z-index:150}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer;color:#475569;font-size:10px}
.nav-item.on{color:#3b82f6}
.nav-icon{font-size:20px;line-height:1}
.watch-wrap,.port-wrap,.alert-wrap{padding:16px 16px 120px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-head h2{font-size:16px;font-weight:700}
.add-btn{background:#3b82f6;color:white;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer}
.form-box{background:#111827;border:1px solid #1e2d45;border-radius:12px;padding:14px;margin-bottom:14px}
.form-lbl{font-size:11px;color:#94a3b8;margin-bottom:4px}
.form-input{width:100%;background:#1a2235;border:1px solid #1e2d45;border-radius:8px;padding:8px 10px;color:#f1f5f9;font-size:13px;margin-bottom:8px;outline:none;-webkit-appearance:none}
.submit-btn{width:100%;background:#10b981;color:white;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer}
.del-btn{background:rgba(239,68,68,0.1);color:#ef4444;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer}
.port-summary{background:linear-gradient(135deg,#1e3a5f,#1e1b4b);border:1px solid #1e2d45;border-radius:16px;padding:16px;margin-bottom:16px}
.alert-banner{background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.4);border-radius:12px;padding:12px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <h1>📈 <span style="color:#3b82f6">株</span>スクリーナー Pro</h1>
    <span class="badge">🔴 デモ</span>
  </div>
  <div class="sum-grid">
    <div class="sum-card"><div class="sum-val" style="color:#3b82f6">3,924</div><div class="sum-lbl">対象銘柄</div></div>
    <div class="sum-card"><div class="sum-val" style="color:#10b981">47</div><div class="sum-lbl">通過銘柄</div></div>
    <div class="sum-card"><div class="sum-val" style="color:#f59e0b">12</div><div class="sum-lbl">高評価</div></div>
    <div class="sum-card"><div class="sum-val" style="color:#ef4444">+2.3%</div><div class="sum-lbl">TOPIX</div></div>
  </div>
</div>

<div id="app"></div>

<div class="nav">
  <div class="nav-item on" onclick="showTab('screener',this)"><div class="nav-icon">🔍</div>スクリーナー</div>
  <div class="nav-item" onclick="showTab('watch',this)"><div class="nav-icon">⭐</div>ウォッチ</div>
  <div class="nav-item" onclick="showTab('portfolio',this)"><div class="nav-icon">💼</div>ポートフォリオ</div>
  <div class="nav-item" onclick="showTab('alert',this)"><div class="nav-icon">🔔</div>アラート</div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const STOCKS=[
  {code:"149A",market:"グロース",name:"シンカ",price:1842,chg:3.2,score:9,equity:72.4,op:18.3,growth:34,per:24.1,pbr:0.87,roe:22.1,
   conds:["自己資本✓","増収増益✓","営業CF+✓","MA線上✓","ストック型✓"],fails:["PBR1倍↑✗"],
   chart:[1200,1280,1350,1290,1420,1480,1390,1520,1610,1580,1680,1750,1800,1842],up:true,sector:"SaaS・ストック型",owner:true,foreign:24.3,years:3},
  {code:"7354",market:"スタンダード",name:"デジタルHD",price:3210,chg:1.8,score:8,equity:68.1,op:14.7,growth:21,per:12.4,pbr:0.72,roe:17.3,
   conds:["自己資本✓","増収増益✓","PBR割れ✓","MA線上✓"],fails:["上場5年内✗"],
   chart:[2800,2900,2750,2850,3000,3100,3050,3150,3200,3180,3220,3210],up:true,sector:"DX・ITサービス",owner:true,foreign:18.2,years:7},
  {code:"5023",market:"グロース",name:"テックアルファ",price:892,chg:-0.9,score:6,equity:55.3,op:9.8,growth:28,per:18.2,pbr:1.3,roe:11.2,
   conds:["自己資本✓","増収増益✓","上場3年✓"],fails:["利益率10%✗","MA線下✗"],
   chart:[1000,980,920,950,900,880,860,910,870,890,895,892],up:false,sector:"AI・クラウド",owner:false,foreign:12.1,years:3},
  {code:"9876",market:"プライム",name:"グリーンベータ",price:5430,chg:4.1,score:8,equity:81.2,op:22.5,growth:19,per:14.8,pbr:0.91,roe:19.8,
   conds:["自己資本✓","増収増益✓","営業CF+✓","PBR割れ✓","MA線上✓","ROE15%↑✓"],fails:[],
   chart:[4200,4350,4500,4400,4600,4800,4750,4900,5100,5200,5350,5430],up:true,sector:"環境・エネルギー",owner:true,foreign:31.5,years:12},
  {code:"3827",market:"グロース",name:"モバイルファクトリー",price:1245,chg:2.3,score:7,equity:61,op:12.4,growth:18,per:16.5,pbr:0.95,roe:15.8,
   conds:["自己資本✓","増収増益✓","MA線上✓"],fails:["外国人20%✗"],
   chart:[980,1020,1060,1010,1080,1120,1090,1150,1200,1180,1230,1245],up:true,sector:"モバイル・ゲーム",owner:true,foreign:14.2,years:8},
];

const FILTERS=["自己資本50%↑","営業CF黒字","増収増益","利益率10%↑","MA線上","PBR1倍割れ","上場5年内","ROE15%↑","出来高急増"];
const TABS=["すべて","グロース🚀","バリュー💎","モメンタム⚡","IPO新着"];
let activeTab=0,filterOn=[true,true,true,true,true,false,false,false,false],runState=0;
let watchList=[{code:"149A",name:"シンカ",price:1842,chg:3.2,alert:1900},{code:"9876",name:"グリーンベータ",price:5430,chg:4.1,alert:5500}];
let portfolio=[{code:"149A",name:"シンカ",qty:100,avg:1600,price:1842},{code:"7354",name:"デジタルHD",qty:50,avg:3000,price:3210}];
let alerts=[{id:1,code:"149A",name:"シンカ",type:"価格上昇",target:"¥1,900",status:"待機中",color:"#10b981"},{id:2,code:"9876",name:"グリーンベータ",type:"MAクロス",target:"25日MA超え",status:"発動！",color:"#f59e0b"},{id:3,code:"5023",name:"テックアルファ",type:"出来高急増",target:"平均2倍以上",status:"待機中",color:"#3b82f6"}];
let currentNav="screener";

function cv(c){return{g:"#10b981",w:"#f59e0b",r:"#ef4444"}[c]||"#f1f5f9";}
function gc(v,hi,lo){return v>=hi?"g":v>=lo?"w":"r";}

function drawChart(id,data,color){
  const el=document.getElementById(id);if(!el)return;
  const w=el.offsetWidth||300,h=44;el.width=w*2;el.height=h*2;
  const ctx=el.getContext("2d");ctx.scale(2,2);
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,color+"55");g.addColorStop(1,color+"08");
  ctx.beginPath();data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=h-(v-mn)/rng*(h-10)-5;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=h-(v-mn)/rng*(h-10)-5;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin="round";ctx.stroke();
}

function getList(){
  return STOCKS.filter(s=>{
    if(activeTab===1)return s.market==="グロース";
    if(activeTab===2)return s.pbr<1;
    if(activeTab===3)return s.chg>2;
    if(activeTab===4)return s.years<=3;
    return true;
  }).sort((a,b)=>b.score-a.score);
}

function renderScreener(){
  const list=getList();
  let html=`
  <div class="tabs">${TABS.map((t,i)=>`<div class="tab ${i===activeTab?'on':''}" onclick="setTab(${i})">${t}</div>`).join("")}</div>
  <div class="filters">
    <div class="filter-top"><span>🎯 必須条件</span><span onclick="allOn()">全ON</span></div>
    <div class="chip-grid">${FILTERS.map((f,i)=>`<div class="chip ${filterOn[i]?'on':''}" onclick="toggleFilter(${i})"><div class="dot"></div>${f}</div>`).join("")}</div>
    <div class="btn-row">
      <button class="btn btn-blue" onclick="runScreen()">${runState===1?"⏳ 取得中...":runState===2?"✅ "+list.length+"銘柄ヒット！":"🔍 スクリーニング実行"}</button>
      <button class="btn btn-gray" onclick="resetFilters()">↺ リセット</button>
    </div>
  </div>
  <div class="result-bar"><div>該当 <b>${list.length}</b> 銘柄</div><div style="color:#3b82f6;font-size:11px">スコア順 ▾</div></div>
  <div class="list">`;
  list.forEach(s=>{
    html+=`<div class="card" onclick="openModal('${s.code}')">
      <div class="card-bar" style="background:${s.score>=8?"#10b981":"#f59e0b"}"></div>
      <div class="card-top">
        <div><div class="code">${s.code}<span class="mkt">${s.market}</span></div><div class="sname">${s.name}</div></div>
        <div class="score-box" style="background:${s.score>=8?"rgba(16,185,129,0.1)":"rgba(245,158,11,0.1)"};border:1px solid ${s.score>=8?"rgba(16,185,129,0.3)":"rgba(245,158,11,0.3)"}">
          <div class="score-num" style="color:${s.score>=8?"#10b981":"#f59e0b"}">${s.score}</div><div class="score-lbl">/ 10点</div>
        </div>
      </div>
      <div class="price-row"><div class="price">¥${s.price.toLocaleString()}</div><div class="chg" style="color:${s.chg>=0?"#10b981":"#ef4444"}">${s.chg>=0?"▲":"▼"} ${Math.abs(s.chg)}%</div></div>
      <div class="met-grid">
        ${[["自己資本",s.equity+"%",gc(s.equity,70,50)],["営業利益率",s.op+"%",gc(s.op,15,10)],["売上成長","+"+s.growth+"%","g"],["PER",s.per+"倍",s.per<=15?"g":s.per<=20?"w":"r"],["PBR",s.pbr+"倍",s.pbr<1?"g":"w"],["ROE",s.roe+"%",gc(s.roe,15,10)]].map(([l,v,c])=>`<div class="met"><div class="met-lbl">${l}</div><div class="met-val" style="color:${cv(c)}">${v}</div></div>`).join("")}
      </div>
      <div class="cond-row">
        ${s.conds.map(c=>`<span class="ct ct-pass">${c}</span>`).join("")}
        ${s.fails.map(c=>`<span class="ct ct-fail">${c}</span>`).join("")}
      </div>
      <div class="chart-wrap"><canvas id="chart_${s.code}"></canvas></div>
    </div>`;
  });
  html+="</div>";
  document.getElementById("app").innerHTML=html;
  list.forEach(s=>drawChart("chart_"+s.code,s.chart,s.up?"#10b981":"#ef4444"));
}

function renderWatch(){
  let html=`<div class="watch-wrap">
  <div class="section-head"><h2>⭐ ウォッチリスト</h2><button class="add-btn" onclick="showWatchForm()">+ 追加</button></div>
  <div id="watchForm" style="display:none" class="form-box">
    <div class="form-lbl">銘柄コード or 名前</div>
    <input class="form-input" id="wCode" placeholder="例: 149A / シンカ">
    <div class="form-lbl">アラート価格（任意）</div>
    <input class="form-input" id="wAlert" placeholder="例: 2000">
    <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">利用可能: ${STOCKS.map(s=>s.code).join(", ")}</div>
    <button class="submit-btn" onclick="addWatch()">追加する</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">`;
  watchList.forEach(s=>{
    const f=STOCKS.find(x=>x.code===s.code);
    const hit=s.alert&&s.price>=s.alert;
    html+=`<div style="background:#111827;border:1px solid ${hit?"rgba(245,158,11,0.5)":"#1e2d45"};border-radius:12px;padding:14px;position:relative;overflow:hidden">
      ${hit?'<div style="position:absolute;top:0;left:0;right:0;height:2px;background:#f59e0b"></div>':''}
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div><div class="code">${s.code}<span class="mkt">${f?.market||""}</span></div><div class="sname">${s.name}</div></div>
        <button class="del-btn" onclick="delWatch('${s.code}')">削除</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="price-row"><div class="price">¥${s.price.toLocaleString()}</div><div class="chg" style="color:${s.chg>=0?"#10b981":"#ef4444"}">${s.chg>=0?"▲":"▼"} ${Math.abs(s.chg)}%</div></div>
        ${s.alert?`<div style="text-align:right"><div style="font-size:10px;color:#94a3b8">アラート</div><div style="font-size:13px;font-weight:600;color:${hit?"#f59e0b":"#94a3b8"}">${hit?"🔔":"🔕"} ¥${s.alert.toLocaleString()}</div></div>`:""}
      </div>
      ${f?`<div class="chart-wrap" style="margin-top:10px"><canvas id="wchart_${s.code}"></canvas></div>`:""}
    </div>`;
  });
  html+="</div></div>";
  document.getElementById("app").innerHTML=html;
  watchList.forEach(s=>{const f=STOCKS.find(x=>x.code===s.code);if(f)drawChart("wchart_"+s.code,f.chart,f.up?"#10b981":"#ef4444");});
}

function renderPortfolio(){
  const tv=portfolio.reduce((s,p)=>s+p.qty*p.price,0);
  const tc=portfolio.reduce((s,p)=>s+p.qty*p.avg,0);
  const tp=tv-tc;
  let html=`<div class="port-wrap">
  <div class="port-summary">
    <div style="font-size:12px;color:#94a3b8;margin-bottom:4px">💼 ポートフォリオ合計</div>
    <div style="font-size:28px;font-weight:800;margin-bottom:4px">¥${tv.toLocaleString()}</div>
    <div style="display:flex;gap:16px">
      <div><div style="font-size:10px;color:#94a3b8">損益</div><div style="font-size:16px;font-weight:700;color:${tp>=0?"#10b981":"#ef4444"}">${tp>=0?"+":""}${tp.toLocaleString()}円</div></div>
      <div><div style="font-size:10px;color:#94a3b8">損益率</div><div style="font-size:16px;font-weight:700;color:${tp>=0?"#10b981":"#ef4444"}">${tp>=0?"+":""}${(tp/tc*100).toFixed(1)}%</div></div>
    </div>
  </div>
  <div class="section-head"><h2 style="font-size:14px;color:#94a3b8">保有銘柄</h2><button class="add-btn" onclick="showPortForm()">+ 追加</button></div>
  <div id="portForm" style="display:none" class="form-box">
    <div class="form-lbl">銘柄コード/名前</div><input class="form-input" id="pCode" placeholder="例: 149A">
    <div class="form-lbl">保有数量(株)</div><input class="form-input" id="pQty" placeholder="例: 100">
    <div class="form-lbl">取得単価(円)</div><input class="form-input" id="pAvg" placeholder="例: 1600">
    <button class="submit-btn" onclick="addPort()">追加する</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">`;
  portfolio.forEach(p=>{
    const pnl=(p.price-p.avg)*p.qty,pp=((p.price-p.avg)/p.avg*100).toFixed(1),ok=pnl>=0;
    html+=`<div style="background:#111827;border:1px solid #1e2d45;border-radius:12px;padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div><div class="code">${p.code}</div><div class="sname">${p.name}</div><div style="font-size:11px;color:#94a3b8;margin-top:2px">${p.qty}株 ｜ 取得 ¥${p.avg.toLocaleString()}</div></div>
        <button class="del-btn" onclick="delPort('${p.code}')">削除</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <div style="background:#1a2235;border-radius:8px;padding:8px"><div style="font-size:10px;color:#94a3b8">現在値</div><div style="font-size:14px;font-weight:700">¥${p.price.toLocaleString()}</div></div>
        <div style="background:#1a2235;border-radius:8px;padding:8px"><div style="font-size:10px;color:#94a3b8">評価額</div><div style="font-size:14px;font-weight:700">¥${(p.price*p.qty).toLocaleString()}</div></div>
        <div style="background:${ok?"rgba(16,185,129,0.1)":"rgba(239,68,68,0.1)"};border:1px solid ${ok?"rgba(16,185,129,0.3)":"rgba(239,68,68,0.3)"};border-radius:8px;padding:8px">
          <div style="font-size:10px;color:#94a3b8">損益</div>
          <div style="font-size:13px;font-weight:700;color:${ok?"#10b981":"#ef4444"}">${ok?"+":""}${pnl.toLocaleString()}</div>
          <div style="font-size:10px;color:${ok?"#10b981":"#ef4444"}">${ok?"+":""}${pp}%</div>
        </div>
      </div>
    </div>`;
  });
  html+="</div></div>";
  document.getElementById("app").innerHTML=html;
}

function renderAlert(){
  const types=["価格上昇","価格下落","MAクロス","出来高急増","決算発表","52週高値"];
  let html=`<div class="alert-wrap">
  <div class="section-head"><h2>🔔 アラート設定</h2><button class="add-btn" onclick="showAlertForm()">+ 追加</button></div>
  ${alerts.some(a=>a.status==="発動！")?`<div class="alert-banner"><div style="font-size:22px">🔔</div><div><div style="font-size:13px;font-weight:700;color:#f59e0b">アラート発動中！</div><div style="font-size:11px;color:#94a3b8">グリーンベータ｜MAクロス検出</div></div></div>`:""}
  <div id="alertForm" style="display:none" class="form-box">
    <div class="form-lbl">銘柄</div><input class="form-input" id="aCode" placeholder="例: 149A / シンカ">
    <div class="form-lbl">種別</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px">
      ${types.map(t=>`<div id="atype_${t}" onclick="selectType('${t}')" style="padding:7px;border-radius:8px;font-size:11px;text-align:center;cursor:pointer;background:#1a2235;border:1px solid #1e2d45;color:#94a3b8">${t}</div>`).join("")}
    </div>
    <div class="form-lbl">目標値（任意）</div><input class="form-input" id="aTarget" placeholder="例: 2000">
    <button class="submit-btn" onclick="addAlert()">設定する</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">`;
  alerts.forEach(a=>{
    html+=`<div style="background:#111827;border:1px solid ${a.status==="発動！"?"rgba(245,158,11,0.5)":"#1e2d45"};border-radius:12px;padding:14px;position:relative;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${a.color}"></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <div style="font-size:14px;font-weight:700">${a.name}</div>
            <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${a.status==="発動！"?"rgba(245,158,11,0.2)":"rgba(59,130,246,0.15)"};color:${a.status==="発動！"?"#f59e0b":"#94a3b8"};font-weight:600">${a.status}</span>
          </div>
          <div style="font-size:11px;color:#94a3b8">種別：${a.type}</div>
          <div style="font-size:11px;color:#94a3b8">目標：${a.target}</div>
        </div>
        <button class="del-btn" onclick="delAlert(${a.id})">削除</button>
      </div>
    </div>`;
  });
  html+="</div></div>";
  document.getElementById("app").innerHTML=html;
}

let selectedAlertType="価格上昇";
function selectType(t){
  selectedAlertType=t;
  document.querySelectorAll("[id^='atype_']").forEach(el=>{el.style.background="#1a2235";el.style.borderColor="#1e2d45";el.style.color="#94a3b8";});
  const el=document.getElementById("atype_"+t);
  if(el){el.style.background="#3b82f6";el.style.borderColor="#3b82f6";el.style.color="white";}
}

function render(){
  if(currentNav==="screener")renderScreener();
  else if(currentNav==="watch")renderWatch();
  else if(currentNav==="portfolio")renderPortfolio();
  else if(currentNav==="alert")renderAlert();
}

function showTab(name,el){
  currentNav=name;
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("on"));
  el.classList.add("on");
  render();
}
function setTab(i){activeTab=i;render();}
function toggleFilter(i){filterOn[i]=!filterOn[i];render();}
function allOn(){filterOn=filterOn.map(()=>true);render();}
function resetFilters(){filterOn=FILTERS.map((_,i)=>i<5);render();}
function runScreen(){
  runState=1;render();
  setTimeout(()=>{runState=2;render();setTimeout(()=>{runState=0;render();},2500);},1600);
}

function openModal(code){
  const s=STOCKS.find(x=>x.code===code);if(!s)return;
  document.getElementById("modalContent").innerHTML=`
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:4px">
      <h2>${s.name}</h2><span class="mkt">${s.market}</span>
    </div>
    <div class="modal-sub">${s.code}｜${s.sector}</div>
    <div class="modal-price"><div class="p">¥${s.price.toLocaleString()}</div><div class="chg" style="color:${s.chg>=0?"#10b981":"#ef4444"}">${s.chg>=0?"▲":"▼"} ${Math.abs(s.chg)}%</div></div>
    ${[["📊 財務指標",[["自己資本比率",s.equity+"%","g"],["営業利益率",s.op+"%","g"],["有利子負債","ほぼ0","g"],["営業CF","黒字✓","g"],["売上成長","+"+s.growth+"%","g"],["ROE",s.roe+"%","g"]]],
      ["💰 バリュエーション",[["PER",s.per+"倍",s.per<=15?"g":"w"],["PBR",s.pbr+"倍",s.pbr<1?"g":"w"],["PSR","0.94倍","g"],["配当利回り","−",""]]],
      ["⚡ モメンタム",[["52週高値比","92%","g"],["出来高比率","2.1倍","g"],["25日MA","上抜け✓","g"],["75日MA","上抜け✓","g"]]],
      ["🏢 会社情報",[["オーナー経営者",s.owner?"✓ 創業者":"✗ 非創業者",s.owner?"g":"r"],["上場年数",s.years+"年",s.years<=5?"g":"w"],["外国人比率",s.foreign+"%",s.foreign>=20?"g":"w"],["ビジネス型",s.sector,"g"]]]
    ].map(([title,rows])=>`<div class="msec"><div class="msec-title">${title}</div><div class="mgrid">${rows.map(([l,v,c])=>`<div class="mmet"><div class="ml">${l}</div><div class="mv" style="color:${cv(c)}">${v}</div></div>`).join("")}</div></div>`).join("")}
  `;
  document.getElementById("modalBg").classList.add("open");
}
function closeModal(){document.getElementById("modalBg").classList.remove("open");}

function showWatchForm(){const f=document.getElementById("watchForm");f.style.display=f.style.display==="none"?"block":"none";}
function addWatch(){
  const code=document.getElementById("wCode").value;
  const alp=document.getElementById("wAlert").value;
  const f=STOCKS.find(s=>s.code===code||s.name.includes(code));
  if(!f)return alert("銘柄が見つかりません");
  watchList.push({code:f.code,name:f.name,price:f.price,chg:f.chg,alert:alp?parseInt(alp):null});
  renderWatch();
}
function delWatch(code){watchList=watchList.filter(x=>x.code!==code);renderWatch();}

function showPortForm(){const f=document.getElementById("portForm");f.style.display=f.style.display==="none"?"block":"none";}
function addPort(){
  const code=document.getElementById("pCode").value;
  const qty=document.getElementById("pQty").value;
  const avg=document.getElementById("pAvg").value;
  const f=STOCKS.find(s=>s.code===code||s.name.includes(code));
  if(!f||!qty||!avg)return alert("入力を確認してください");
  portfolio.push({code:f.code,name:f.name,qty:parseInt(qty),avg:parseInt(avg),price:f.price});
  renderPortfolio();
}
function delPort(code){portfolio=portfolio.filter(x=>x.code!==code);renderPortfolio();}

function showAlertForm(){const f=document.getElementById("alertForm");f.style.display=f.style.display==="none"?"block":"none";}
function addAlert(){
  const code=document.getElementById("aCode").value;
  const target=document.getElementById("aTarget").value;
  const f=STOCKS.find(s=>s.code===code||s.name.includes(code));
  if(!f)return alert("銘柄が見つかりません");
  alerts.push({id:Date.now(),code:f.code,name:f.name,type:selectedAlertType,target:target||"設定なし",status:"待機中",color:"#3b82f6"});
  renderAlert();
}
function delAlert(id){alerts=alerts.filter(x=>x.id!==id);renderAlert();}

render();
</script>
</body>
</html>
